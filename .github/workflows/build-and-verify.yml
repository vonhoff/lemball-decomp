name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + verify (MSVC 4.20)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out portable MSVC 4.20
        uses: actions/checkout@v4
        with:
          repository: itsmattkc/msvc420
          path: msvc420

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tools
        shell: pwsh
        run: |
          python -m pip install --requirement requirements.txt
          $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          "CMAKE_BIN=$cmakeBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check claims and tools
        shell: pwsh
        run: |
          python tools/claims.py check
          if ("${{ github.event_name }}" -eq "pull_request") {
            python tools/claims.py check --base "${{ github.event.pull_request.base.sha }}"
          }
          python -m unittest discover -s tools/tests

      - name: Prepare target binary
        shell: bash
        env:
          LEMBALL_GPG_PASSPHRASE: ${{ secrets.LEMBALL_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes \
            --decrypt \
            --passphrase "$LEMBALL_GPG_PASSPHRASE" \
            --output data/LEMBALL.EXE \
            data/LEMBALL.EXE.gpg

      - name: Configure and build
        shell: cmd
        run: |
          call .\msvc420\bin\VCVARS32.BAT x86
          "%CMAKE_BIN%\cmake.exe" --preset msvc420
          "%CMAKE_BIN%\cmake.exe" --build --preset msvc420 --verbose > build-msvc420\build.log 2>&1
          if errorlevel 1 (
            type build-msvc420\build.log
            exit /b 1
          )

      - name: Verify against original
        shell: pwsh
        run: |
          reccmp-project detect --search-path data
          Push-Location build-msvc420
          reccmp-decomplint --target LEMBALL
          reccmp-reccmp --target LEMBALL --json reccmp.json --json-diet --silent
          reccmp-datacmp --target LEMBALL --no-color
          Pop-Location
          python tools/generate_objdiff_report.py

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: LEMBALL_report
          if-no-files-found: error
          path: |
            build-msvc420/report.json
            build-msvc420/reccmp.json

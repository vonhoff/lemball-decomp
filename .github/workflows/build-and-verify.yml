name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + verify (MSVC 4.00)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out portable MSVC 4.00
        uses: actions/checkout@v4
        with:
          repository: vonhoff/MSVC400
          path: msvc400

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tools
        shell: pwsh
        run: python -m pip install --requirement requirements.txt

      - name: Prepare target binary
        shell: bash
        env:
          LEMBALL_GPG_PASSPHRASE: ${{ secrets.LEMBALL_GPG_PASSPHRASE }}
        run: |
          gpg --quiet --batch --yes \
            --decrypt \
            --passphrase "$LEMBALL_GPG_PASSPHRASE" \
            --output data/LEMBALL.EXE \
            data/LEMBALL.EXE.gpg

      - name: Lint metadata
        shell: pwsh
        run: python tools/lint_reccmp_metadata.py

      - name: Configure and build
        shell: pwsh
        run: python tools/build_msvc400.py

      - name: Verify against original
        shell: pwsh
        run: |
          reccmp-project detect --search-path data
          Push-Location build-msvc400
          reccmp-decomplint --target LEMBALL
          reccmp-reccmp --target LEMBALL --json reccmp.json --json-diet --silent
          reccmp-datacmp --target LEMBALL --no-color
          reccmp-vtable --target LEMBALL
          Pop-Location
          python tools/generate_objdiff_report.py

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: LEMBALL_report
          if-no-files-found: error
          path: |
            build-msvc400/report.json
            build-msvc400/reccmp.json

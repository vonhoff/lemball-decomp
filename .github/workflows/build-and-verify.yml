name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    name: Build + verify (MSVC 4.00)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out portable MSVC 4.00
        uses: actions/checkout@v4
        with:
          repository: vonhoff/MSVC400
          path: msvc400

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tools
        shell: pwsh
        run: python -m pip install --requirement requirements.txt

      - name: Configure MSVC 4.00 environment
        shell: pwsh
        run: |
          "MSVC400_ROOT=$env:GITHUB_WORKSPACE\msvc400" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$env:GITHUB_WORKSPACE\msvc400\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$env:GITHUB_WORKSPACE\msvc400\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:GITHUB_WORKSPACE\msvc400\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare target binary
        shell: bash
        env:
          LEMBALL_REFERENCE_URL: ${{ secrets.LEMBALL_REFERENCE_URL }}
          LEMBALL_SHA256: d6337b58ccaf98df728b1490812cad0f927802d2e2c5fc932d00961f97027f63
        run: |
          if [ -z "${LEMBALL_REFERENCE_URL:-}" ]; then
            echo '::error::LEMBALL_REFERENCE_URL secret is not set'
            exit 1
          fi
          if [ -z "${LEMBALL_SHA256:-}" ]; then
            echo '::error::LEMBALL_SHA256 secret is not set'
            exit 1
          fi
          if ! [[ "$LEMBALL_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo '::error::LEMBALL_SHA256 must be exactly 64 hexadecimal characters'
            exit 1
          fi
          if ! curl --fail --location --silent --show-error \
            "$LEMBALL_REFERENCE_URL" \
            --output "$RUNNER_TEMP/LEMBALL.EXE"; then
            echo '::error::reference download failed; verify the URL is public and directly downloadable'
            exit 1
          fi
          actual=$(REFERENCE_PATH="$RUNNER_TEMP/LEMBALL.EXE" python -c 'import hashlib, os; print(hashlib.file_digest(open(os.environ["REFERENCE_PATH"], "rb"), "sha256").hexdigest())')
          if [ "$actual" != "$LEMBALL_SHA256" ]; then
            echo "::error::reference SHA-256 mismatch (downloaded: $actual)"
            exit 1
          fi
          cp "$RUNNER_TEMP/LEMBALL.EXE" data/LEMBALL.EXE

      - name: Configure and build
        shell: pwsh
        run: |
          cmake --fresh --preset msvc400
          cmake --build --preset msvc400 --clean-first
          if (!(Test-Path build-msvc400\LEMBALL.EXE)) {
            throw 'build did not produce LEMBALL.EXE'
          }

      - name: Generate objdiff report
        shell: pwsh
        run: |
          python tools/generate_objdiff_report.py

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: LEMBALL_report
          if-no-files-found: error
          path: |
            build-msvc400/report.json
            build-msvc400/reccmp.json

      - name: Remove target binary
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\LEMBALL.EXE" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE\data\LEMBALL.EXE" -Force -ErrorAction SilentlyContinue

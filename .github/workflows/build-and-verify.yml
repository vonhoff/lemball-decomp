name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    name: Build + verify (MSVC 4.00)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out portable MSVC 4.00
        uses: actions/checkout@v4
        with:
          repository: vonhoff/MSVC400
          path: msvc400

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tools
        shell: pwsh
        run: python -m pip install --requirement requirements.txt

      - name: Configure MSVC 4.00 environment
        shell: pwsh
        run: |
          "MSVC400_ROOT=$env:GITHUB_WORKSPACE\msvc400" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$env:GITHUB_WORKSPACE\msvc400\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$env:GITHUB_WORKSPACE\msvc400\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:GITHUB_WORKSPACE\msvc400\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare target binary
        shell: bash
        env:
          LEMBALL_REFERENCE_URL: ${{ secrets.LEMBALL_REFERENCE_URL }}
          LEMBALL_SHA256: ${{ secrets.LEMBALL_SHA256 }}
        run: |
          test -n "$LEMBALL_REFERENCE_URL"
          test -n "$LEMBALL_SHA256"
          curl --fail --location --silent --show-error \
            "$LEMBALL_REFERENCE_URL" \
            --output "$RUNNER_TEMP/LEMBALL.EXE"
          actual=$(sha256sum "$RUNNER_TEMP/LEMBALL.EXE" | cut -d' ' -f1)
          test "$actual" = "$LEMBALL_SHA256"
          cp "$RUNNER_TEMP/LEMBALL.EXE" data/LEMBALL.EXE

      - name: Lint metadata
        shell: pwsh
        run: python tools/lint_reccmp_metadata.py

      - name: Configure and build
        shell: pwsh
        run: |
          python tools/install_reccmp_compat.py
          cmake --fresh --preset msvc400
          cmake --build --preset msvc400 --clean-first

      - name: Verify against original
        shell: pwsh
        run: |
          reccmp-project detect --search-path data
          Push-Location build-msvc400
          reccmp-decomplint --target LEMBALL
          reccmp-reccmp --target LEMBALL --json reccmp.json --json-diet --silent
          reccmp-datacmp --target LEMBALL --no-color
          reccmp-vtable --target LEMBALL
          Pop-Location
          python tools/generate_objdiff_report.py

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: LEMBALL_report
          if-no-files-found: error
          path: |
            build-msvc400/report.json
            build-msvc400/reccmp.json

      - name: Remove target binary
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\LEMBALL.EXE" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$env:GITHUB_WORKSPACE\data\LEMBALL.EXE" -Force -ErrorAction SilentlyContinue

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + verify (MSVC 4.00)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: S:\

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out portable MSVC 4.00
        uses: actions/checkout@v7
        with:
          repository: vonhoff/MSVC400
          path: msvc400

      - name: Set up short workspace drive
        working-directory: .
        run: 'subst S: $env:GITHUB_WORKSPACE'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - name: Install Python tools
        run: python -m pip install --requirement requirements.txt

      - name: Configure MSVC 4.00 environment
        run: |
          "MSVC400_ROOT=S:\msvc400" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=S:\msvc400\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=S:\msvc400\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "S:\msvc400\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Gate checks
        run: python tools/gate.py

      - name: Tool tests
        working-directory: S:\tools
        run: python -m unittest discover -s tests

      - name: Prepare target binary
        env:
          LEMBALL_REFERENCE_URL: ${{ secrets.LEMBALL_REFERENCE_URL }}
          LEMBALL_SHA256: d6337b58ccaf98df728b1490812cad0f927802d2e2c5fc932d00961f97027f63
        run: |
          if (!$env:LEMBALL_REFERENCE_URL) {
            throw 'LEMBALL_REFERENCE_URL secret is not set'
          }
          New-Item -ItemType Directory -Force data | Out-Null
          Invoke-WebRequest -Uri $env:LEMBALL_REFERENCE_URL -OutFile data/LEMBALL.EXE
          $actual = (Get-FileHash data/LEMBALL.EXE -Algorithm SHA256).Hash
          if ($actual -ne $env:LEMBALL_SHA256) {
            throw "Reference SHA-256 mismatch (downloaded: $actual)"
          }

      - name: Configure and build
        run: python tools/build.py --clean-first

      - name: Generate objdiff report
        run: python tools/report.py

      - name: Generate progress badges
        run: python tools/badges.py

      - name: Upload progress report
        uses: actions/upload-artifact@v7
        with:
          name: LEMBALL_report
          if-no-files-found: error
          path: |
            build-msvc400/report.json
            build-msvc400/reccmp.json

      - name: Publish progress badges
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const ref = 'heads/badges';
            let parent;
            try {
              parent = (await github.rest.git.getRef({ ...repo, ref })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({
              ...repo,
              tree: ['exact', 'fuzzy', 'effective'].map(name => ({
                path: `${name}.json`, mode: '100644', type: 'blob',
                content: fs.readFileSync(`build-msvc400/badges/${name}.json`, 'utf8')
              }))
            });
            const commit = await github.rest.git.createCommit({
              ...repo, tree: tree.data.sha, parents: parent ? [parent] : [],
              message: `Progress badges for ${context.sha}`
            });
            if (parent) {
              await github.rest.git.updateRef({ ...repo, ref, sha: commit.data.sha });
            } else {
              await github.rest.git.createRef({ ...repo, ref: `refs/${ref}`, sha: commit.data.sha });
            }

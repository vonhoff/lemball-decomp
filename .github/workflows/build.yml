name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    name: Build + verify (MSVC 4.00)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out portable MSVC 4.00
        uses: actions/checkout@v7
        with:
          repository: vonhoff/MSVC400
          path: msvc400

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python tools
        shell: pwsh
        run: python -m pip install --requirement requirements.txt

      - name: Set up short workspace drive
        shell: pwsh
        run: |
          subst S: $env:GITHUB_WORKSPACE

      - name: Configure MSVC 4.00 environment
        shell: pwsh
        run: |
          "MSVC400_ROOT=S:\msvc400" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=S:\msvc400\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=S:\msvc400\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "S:\msvc400\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare target binary
        shell: bash
        env:
          LEMBALL_REFERENCE_URL: ${{ secrets.LEMBALL_REFERENCE_URL }}
          LEMBALL_SHA256: d6337b58ccaf98df728b1490812cad0f927802d2e2c5fc932d00961f97027f63
        run: |
          if [ -z "${LEMBALL_REFERENCE_URL:-}" ]; then
            echo '::error::LEMBALL_REFERENCE_URL secret is not set'
            exit 1
          fi
          if [ -z "${LEMBALL_SHA256:-}" ]; then
            echo '::error::LEMBALL_SHA256 secret is not set'
            exit 1
          fi
          if ! [[ "$LEMBALL_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo '::error::LEMBALL_SHA256 must be exactly 64 hexadecimal characters'
            exit 1
          fi
          if ! curl --fail --location --silent --show-error \
            "$LEMBALL_REFERENCE_URL" \
            --output "$RUNNER_TEMP/LEMBALL.EXE"; then
            echo '::error::reference download failed; verify the URL is public and directly downloadable'
            exit 1
          fi
          actual=$(REFERENCE_PATH="$RUNNER_TEMP/LEMBALL.EXE" python -c 'import hashlib, os; print(hashlib.file_digest(open(os.environ["REFERENCE_PATH"], "rb"), "sha256").hexdigest())')
          if [ "$actual" != "$LEMBALL_SHA256" ]; then
            echo "::error::reference SHA-256 mismatch (downloaded: $actual)"
            exit 1
          fi
          mkdir -p data
          cp "$RUNNER_TEMP/LEMBALL.EXE" data/LEMBALL.EXE

      - name: Configure and build
        shell: pwsh
        working-directory: S:\
        run: |
          python tools/build.py --clean-first
          if (!(Test-Path build-msvc400\LEMBALL.EXE)) {
            throw 'build did not produce LEMBALL.EXE'
          }

      - name: Generate objdiff report
        shell: pwsh
        working-directory: S:\
        run: |
          python tools/report.py

      - name: Gate checks
        shell: pwsh
        working-directory: S:\
        run: python tools/gate.py

      - name: Vtable comparison (informational)
        continue-on-error: true
        shell: pwsh
        working-directory: S:\
        run: python tools/gate.py --vtable

      - name: Generate progress badges
        shell: pwsh
        working-directory: S:\
        run: python tools/badges.py

      - name: Upload progress report
        uses: actions/upload-artifact@v7
        with:
          name: LEMBALL_report
          if-no-files-found: error
          path: |
            build-msvc400/report.json
            build-msvc400/reccmp.json

      - name: Publish progress badges
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const ref = 'heads/badges';
            let parent;
            try {
              parent = (await github.rest.git.getRef({ ...repo, ref })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({
              ...repo,
              tree: ['exact', 'fuzzy', 'effective'].map(name => ({
                path: `${name}.json`, mode: '100644', type: 'blob',
                content: fs.readFileSync(`build-msvc400/badges/${name}.json`, 'utf8')
              }))
            });
            const commit = await github.rest.git.createCommit({
              ...repo, tree: tree.data.sha, parents: parent ? [parent] : [],
              message: `Progress badges for ${context.sha}`
            });
            if (parent) {
              await github.rest.git.updateRef({ ...repo, ref, sha: commit.data.sha });
            } else {
              await github.rest.git.createRef({ ...repo, ref: `refs/${ref}`, sha: commit.data.sha });
            }

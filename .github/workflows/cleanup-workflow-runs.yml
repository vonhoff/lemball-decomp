name: cleanup workflow runs

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete completed workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "/repos/$GH_REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' |
            while read -r run_id; do
              gh api --method DELETE "/repos/$GH_REPO/actions/runs/$run_id"
            done
